  <g fill="#EC407A"><circle cx="795" cy="800" r="46"/><circle cx="750" cy="815" r="32"/><circle cx="842" cy="818" r="34"/></g>
  <g fill="#F48FB1"><circle cx="785" cy="788" r="20"/><circle cx="835" cy="808" r="12"/></g>
  <!-- casa com tudo aceso -->
