<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6EC6FF"/>
      <stop offset="0.55" stop-color="#BFE6FF"/>
      <stop offset="0.75" stop-color="#FFE0B2"/>
      <stop offset="0.85" stop-color="#FFCC80"/>
    </linearGradient>
    <radialGradient id="sol" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFDE7"/><stop offset="1" stop-color="#FFD54F"/>
    </radialGradient>
    <radialGradient id="brilhoSol" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF59D" stop-opacity="0.7"/><stop offset="1" stop-color="#FFF59D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chao" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8BAA4A"/><stop offset="1" stop-color="#5B7A30"/>
    </linearGradient>
    <radialGradient id="janela" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF3C4" stop-opacity="0.7"/><stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#ceu)"/>
  <circle cx="700" cy="780" r="260" fill="url(#brilhoSol)"/>
  <circle cx="700" cy="790" r="80" fill="url(#sol)"/>
