<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="parede" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A3E4A"/><stop offset="1" stop-color="#6E4A4F"/>
    </linearGradient>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6A4C7A"/><stop offset="0.55" stop-color="#E07A5F"/><stop offset="1" stop-color="#F6B26B"/>
    </linearGradient>
    <linearGradient id="geladeira" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8EEF2"/><stop offset="1" stop-color="#BCC8CF"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD9A0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFD9A0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- parede -->
  <rect width="900" height="1200" fill="url(#parede)"/>
  <!-- azulejos atrás da bancada -->
  <g opacity="0.18" stroke="#FFFFFF" stroke-width="2">
    <path d="M0 640 H560 M0 690 H560 M0 740 H560"/>
    <path d="M40 640 V780 M100 640 V780 M160 640 V780 M220 640 V780 M280 640 V780 M340 640 V780 M400 640 V780 M460 640 V780 M520 640 V780"/>
  </g>

  <!-- janela com o fim de tarde -->
  <rect x="120" y="230" width="320" height="300" rx="8" fill="url(#ceu)"/>
  <circle cx="330" cy="470" r="46" fill="#FFD27F" opacity="0.9"/>
  <path d="M120 470 Q 200 440 280 468 T 440 460 V530 H120 Z" fill="#4E3B52" opacity="0.85"/>
  <ellipse cx="210" cy="300" rx="60" ry="18" fill="#4B3A5C" opacity="0.8"/>
  <path d="M280 230 V530 M120 380 H440" stroke="#5D4037" stroke-width="10"/>
  <rect x="120" y="230" width="320" height="300" rx="8" fill="none" stroke="#6D4C41" stroke-width="14"/>
  <!-- cortininha -->
  <path d="M110 220 H450 V262 Q 400 290 350 262 Q 300 290 250 262 Q 200 290 150 262 Q 130 276 110 262 Z" fill="#E57373"/>
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="150" cy="240" r="5"/><circle cx="210" cy="244" r="5"/><circle cx="270" cy="240" r="5"/>
    <circle cx="330" cy="244" r="5"/><circle cx="390" cy="240" r="5"/><circle cx="430" cy="246" r="5"/>
  </g>

  <!-- prateleira com potes e vasinho -->
  <rect x="80" y="160" width="400" height="14" rx="6" fill="#6D4C41"/>
  <rect x="100" y="118" width="40" height="42" rx="6" fill="#F5E6CC"/><rect x="100" y="112" width="40" height="10" rx="4" fill="#A1887F"/>
  <rect x="152" y="126" width="36" height="34" rx="6" fill="#F5E6CC"/><rect x="152" y="120" width="36" height="10" rx="4" fill="#A1887F"/>
  <path d="M400 160 L 392 128 H 438 L 430 160 Z" fill="#D07B4A"/>
  <path d="M415 128 C 400 100, 380 100, 386 84 M415 128 C 418 96, 432 92, 440 80 M415 128 C 412 104, 420 96, 414 78" stroke="#4CAF50" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- luminária pendente -->
  <path d="M330 0 V70" stroke="#3E2723" stroke-width="4"/>
  <path d="M290 110 Q 330 60 370 110 Z" fill="#FFB74D"/>
  <circle cx="330" cy="200" r="230" fill="url(#luz)"/>

  <!-- bancada e armários de baixo -->
  <rect x="0" y="780" width="580" height="26" rx="4" fill="#8D6E63"/>
  <rect x="0" y="806" width="570" height="140" fill="#5D7A6E"/>
  <path d="M190 806 V946 M380 806 V946" stroke="#455F55" stroke-width="6"/>
  <g fill="#E0C9A6"><rect x="140" y="830" width="34" height="8" rx="4"/><rect x="330" y="830" width="34" height="8" rx="4"/><rect x="520" y="830" width="34" height="8" rx="4"/></g>
  <!-- fruteira e chaleira na bancada -->
  <path d="M60 780 Q 110 820 160 780 Z" fill="#A1887F"/>
  <circle cx="90" cy="770" r="16" fill="#E53935"/><circle cx="118" cy="764" r="16" fill="#FFB300"/><circle cx="140" cy="774" r="14" fill="#7CB342"/>
  <path d="M400 780 C 400 740, 470 740, 470 780 Z" fill="#C62828"/>
  <path d="M470 760 L 500 744" stroke="#C62828" stroke-width="8" stroke-linecap="round"/>
  <path d="M420 740 Q 435 724 450 740" stroke="#3E2723" stroke-width="5" fill="none"/>

  <!-- geladeira (direita) com o bilhete preso -->
  <rect x="620" y="300" width="230" height="640" rx="22" fill="url(#geladeira)"/>
  <path d="M620 520 H850" stroke="#9AA8B0" stroke-width="5"/>
  <rect x="640" y="380" width="12" height="90" rx="6" fill="#90A4AE"/>
  <rect x="640" y="560" width="12" height="140" rx="6" fill="#90A4AE"/>
  <!-- bilhete -->
  <g transform="rotate(-6 750 620)">
    <rect x="700" y="570" width="100" height="110" rx="4" fill="#FFF8E1"/>
    <g stroke="#8D6E63" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <path d="M715 605 H785 M715 625 H780 M715 645 H770 M715 665 H750"/>
    </g>
    <circle cx="750" cy="578" r="8" fill="#E53935"/>
  </g>
  <!-- ímãs -->
  <circle cx="700" cy="350" r="12" fill="#FFB300"/><rect x="780" y="430" width="30" height="22" rx="5" fill="#29B6F6"/>

  <!-- piso xadrez -->
  <rect y="940" width="900" height="260" fill="#3B2A24"/>
  <g fill="#4E3A31">
    <path d="M0 940 h90 v65 h-90z M180 940 h90 v65 h-90z M360 940 h90 v65 h-90z M540 940 h90 v65 h-90z M720 940 h90 v65 h-90z"/>
    <path d="M90 1005 h90 v65 h-90z M270 1005 h90 v65 h-90z M450 1005 h90 v65 h-90z M630 1005 h90 v65 h-90z M810 1005 h90 v65 h-90z"/>
    <path d="M0 1070 h90 v65 h-90z M180 1070 h90 v65 h-90z M360 1070 h90 v65 h-90z M540 1070 h90 v65 h-90z M720 1070 h90 v65 h-90z"/>
    <path d="M90 1135 h90 v65 h-90z M270 1135 h90 v65 h-90z M450 1135 h90 v65 h-90z M630 1135 h90 v65 h-90z M810 1135 h90 v65 h-90z"/>
  </g>
  <path d="M0 940 H900" stroke="#2A1F1A" stroke-width="10"/>
</svg>
