    <rect x="360" y="190" width="110" height="130" fill="#F5F0E6" transform="rotate(-4 415 255)"/>
    <rect x="372" y="202" width="86" height="90" fill="#A1887F" transform="rotate(-4 415 255)"/>
    <rect x="490" y="230" width="90" height="110" fill="#F5F0E6" transform="rotate(5 535 285)"/>
    <rect x="500" y="240" width="70" height="72" fill="#8D6E63" transform="rotate(5 535 285)"/>
    <rect x="400" y="350" width="140" height="90" fill="#F5F0E6" transform="rotate(2 470 395)"/>
    <rect x="410" y="360" width="120" height="58" fill="#BCAAA4" transform="rotate(2 470 395)"/>
