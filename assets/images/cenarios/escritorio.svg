  <g fill="#C9A227"><rect x="105" y="830" width="14" height="10"/><rect x="130" y="834" width="22" height="14"/><rect x="165" y="828" width="10" height="20"/><rect x="185" y="836" width="12" height="10"/></g>
  <rect x="250" y="800" width="130" height="62" rx="8" fill="#5D4037"/><circle cx="285" cy="831" r="20" fill="#C9A227"/><circle cx="285" cy="831" r="8" fill="#3E2723"/>
  <g stroke="#3E2723" stroke-width="4"><path d="M320 815 h45 M320 830 h45 M320 845 h45"/></g>
