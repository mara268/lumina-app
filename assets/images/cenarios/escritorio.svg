    <rect x="40" y="250" width="260" height="14" fill="#4E342E"/>
    <rect x="40" y="420" width="260" height="14" fill="#4E342E"/>
    <g>
      <rect x="55" y="180" width="22" height="70" fill="#8E3B2F"/><rect x="80" y="190" width="18" height="60" fill="#3F5A7A"/>
      <rect x="101" y="175" width="26" height="75" fill="#C9A227"/><rect x="130" y="195" width="16" height="55" fill="#5B7A3F"/>
      <rect x="160" y="200" width="60" height="50" rx="6" fill="#5D4037"/><circle cx="178" cy="225" r="12" fill="#C9A227"/><rect x="198" y="212" width="16" height="26" fill="#2B1B17"/>
      <rect x="235" y="185" width="20" height="65" fill="#7E57C2"/><rect x="258" y="192" width="24" height="58" fill="#3F5A7A"/>
      <rect x="55" y="355" width="30" height="65" fill="#5B7A3F"/><rect x="88" y="345" width="20" height="75" fill="#8E3B2F"/>
      <rect x="120" y="370" width="70" height="50" fill="#455A64"/><rect x="128" y="378" width="54" height="30" fill="#7FE7FF" opacity="0.25"/>
      <rect x="205" y="350" width="22" height="70" fill="#C9A227"/><rect x="230" y="360" width="26" height="60" fill="#7E57C2"/>
    </g>
  </g>
