<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="parede" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2633"/><stop offset="1" stop-color="#26394A"/>
    </linearGradient>
    <radialGradient id="brilhoAzul" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7FE7FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7FE7FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="madeira" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6D4C41"/><stop offset="1" stop-color="#3E2723"/>
    </linearGradient>
    <radialGradient id="ambiente" cx="0.7" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#4FC3F7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4FC3F7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#parede)"/>
  <rect width="900" height="1200" fill="url(#ambiente)"/>
  <!-- prateleiras com livros (esquerda) -->
