  <rect x="640" y="250" width="210" height="330" rx="14" fill="#101820" stroke="#37474F" stroke-width="8"/>
  <g fill="#263238">
    <circle cx="690" cy="310" r="13"/><circle cx="745" cy="310" r="13"/><circle cx="800" cy="310" r="13"/>
