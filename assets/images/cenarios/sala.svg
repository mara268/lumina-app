<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="parede" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2438"/><stop offset="1" stop-color="#3A2F45"/>
    </linearGradient>
    <linearGradient id="noite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16213A"/><stop offset="1" stop-color="#2D3E66"/>
    </linearGradient>
    <radialGradient id="abajur" cx="0.5" cy="0.5" r="0.5">
